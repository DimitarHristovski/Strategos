<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/strategos.png" />
    <link rel="apple-touch-icon" href="/strategos.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Strategos</title>
  </head>
  <body>
    <!-- Global SVG filters (referenced from CSS via url(#…)) -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      class="cc-shader-defs"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <!-- Film grain + subtle contrast (battlefield overlay) -->
        <filter id="cc-film-grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch" result="noise" />
          <feColorMatrix
            in="noise"
            type="matrix"
            values="0 0 0 0 0.55  0 0 0 0 0.52  0 0 0 0 0.48  0 0 0 0.16 0"
            result="tinted"
          />
          <feBlend in="SourceGraphic" in2="tinted" mode="overlay" result="grainBlend" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
